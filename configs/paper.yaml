seed: 42

data:
  # External data are intentionally not vendored. Override these paths on the CLI.
  hrtf_path: /path/to/H_log.npy
  directions_path: /path/to/locs.npy
  n_subjects: 200
  n_directions: 793
  n_freq: 106
  selection_train_subjects: [0, 160]
  selection_valid_subjects: [160, 180]
  final_train_subjects: [0, 180]
  test_subjects: [180, 200]

sampling:
  canonical_sizes: [3, 5, 19, 100]
  canonical_probability: 0.5
  random_context_min: 3
  random_context_max: 100
  n_query: 64

model:
  d_model: 128
  d_ff: 256
  n_heads: 8
  n_layers: 4
  conv_kernel: 7
  dropout: 0.1
  direction_bands: 4

training:
  max_selection_epochs: 2000
  validation_every_epochs: 20
  early_stopping_start_epoch: 400
  early_stopping_patience_checks: 2
  early_stopping_min_delta: 0.01
  batch_size: 8
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  num_workers: 0
  output_dir: runs/geoatt

evaluation:
  query_chunk_size: 64
